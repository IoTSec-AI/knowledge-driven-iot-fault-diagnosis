name: Python Code Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  compile-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python source
        run: python -m compileall backend rag simulator